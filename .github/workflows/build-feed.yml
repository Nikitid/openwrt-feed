name: Build feed

# The feed is rebuilt from whatever the member applications have currently
# released. Applications do not push into this repository; they only publish
# their own GitHub Release, which keeps their workflows free of write access
# here and lets a member ship without waiting for the others.
on:
  repository_dispatch:
    types: [member-release]
  workflow_dispatch:
  schedule:
    # Fallback so a missed dispatch cannot leave the feed stale indefinitely.
    - cron: "17 4 * * *"

permissions:
  contents: write

concurrency:
  group: build-feed
  cancel-in-progress: false

jobs:
  feed:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.12"
      - name: Validate feed sources
        run: ./scripts/check-feed.sh
      - name: Install OpenWrt SDK dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            build-essential file gawk gettext libncurses-dev libssl-dev \
            rsync unzip zlib1g-dev zstd
      - name: Download verified OpenWrt SDK
        run: |
          . ./feed.env
          mkdir -p build
          curl --fail --location --silent --show-error \
            "https://downloads.openwrt.org/releases/${FEED_OPENWRT_VERSION}/targets/${FEED_OPENWRT_TARGET}/${FEED_SDK_ARCHIVE}" \
            --output "build/${FEED_SDK_ARCHIVE}"
          printf '%s  %s\n' \
            "$FEED_SDK_SHA256" "build/${FEED_SDK_ARCHIVE}" | sha256sum --check
          tar --use-compress-program=unzstd -xf \
            "build/${FEED_SDK_ARCHIVE}" -C build
      - name: Prepare publisher signing key
        env:
          SIGNING_KEY: ${{ secrets.OPENWRT_APK_SIGNING_KEY }}
        run: |
          test -n "$SIGNING_KEY" || {
            echo 'OPENWRT_APK_SIGNING_KEY is not configured' >&2
            exit 1
          }
          umask 077
          printf '%s\n' "$SIGNING_KEY" > /tmp/openwrt-feed-signing.pem
      # Fetching is separate from assembly so the index build can be exercised
      # offline against a prepared directory.
      - name: Fetch member release APKs
        env:
          GH_TOKEN: ${{ github.token }}
        run: ./scripts/fetch-members.sh
      - name: Assemble signed feed
        run: |
          . ./feed.env
          FEED_SDK_DIR="$PWD/build/${FEED_SDK_ARCHIVE%.tar.zst}" \
          FEED_SIGNING_KEY=/tmp/openwrt-feed-signing.pem \
            ./scripts/assemble-feed.sh
      - name: Remove publisher signing key
        if: ${{ always() }}
        run: rm -f /tmp/openwrt-feed-signing.pem
      - name: Publish feed branch
        run: |
          . ./feed.env
          work="$(mktemp -d)"
          git clone --depth 1 --branch "$FEED_BRANCH" \
            "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" \
            "$work" 2>/dev/null ||
            git clone --depth 1 \
              "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" \
              "$work"
          cd "$work"
          git checkout -B "$FEED_BRANCH"
          find . -mindepth 1 -maxdepth 1 -name .git -prune -o -exec rm -rf {} +
          cp -a "$GITHUB_WORKSPACE"/dist/feed/. .
          git config user.name 'Nikitid'
          git config user.email 'nikitid@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            echo 'feed is already current'
            exit 0
          fi
          git commit -m "feed: rebuild signed index"
          git push origin "HEAD:$FEED_BRANCH"
